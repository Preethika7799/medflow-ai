name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/ scripts/
      - name: Mypy
        run: mypy src/
        continue-on-error: true
      - name: Pytest
        run: pytest tests/unit/ -v --cov=medflow --cov=api --cov-report=term
