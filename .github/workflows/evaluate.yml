name: Evaluation
on:
  pull_request:
    paths:
      - "src/medflow/generation/**"
      - "src/medflow/retrieval/**"
      - "data/synthetic/**"
      - "configs/**"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate synthetic
        run: python data/synthetic/generate_synthetic.py
      - name: Run eval (smoke)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_HOST: localhost
          MEDFLOW_ENV: default
        run: python scripts/run_evaluation.py --profile default
        continue-on-error: true
