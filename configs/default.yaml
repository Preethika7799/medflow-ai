env: default

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 3

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32

ocr:
  engine: paddle
  language: en
  fallback_confidence_threshold: 0.75
  preprocessing:
    deskew: true
    enhance_contrast: true
    remove_noise: false

qdrant:
  host: localhost
  port: 6333
  url: null
  api_key: null
  collection_name: medflow_chunks
  distance_metric: cosine

retrieval:
  strategy: auto
  top_k: 8
  rerank_top_k: 4
  rrf_k: 60
  bm25_index_path: data/bm25_index.json

chunking:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
  separators: ["\n\n", "\n", ". ", " "]

evaluation:
  metrics:
    - faithfulness
    - answer_relevancy
    - context_precision
    - context_recall
    - hallucination
    - toxicity
    - citation_accuracy
  thresholds:
    faithfulness_min: 0.7
    hallucination_max: 0.25
  results_dir: evaluation_results

langfuse:
  enabled: false
  host: http://localhost:3000
  public_key: ""
  secret_key: ""

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:8501
    - http://localhost:3000
  rate_limit_per_minute: 120

deidentify:
  replacement_strategy: mask
  log_detections: true
  entity_types:
    - PERSON
    - DATE_TIME
    - US_SSN
    - US_NPI
    - MRN
    - PROVIDER_ID
    - INSURANCE_ID
    - DOB

paths:
  synthetic_documents: data/synthetic/documents
  golden_qa: data/synthetic/golden_qa.json

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-12-v2
